<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Member Ops | THE JAGO</title>
    <meta name="description" content="Backend member automation system for The Jago Store." />

    <link rel="shortcut icon" href="/backend/icon/logomember.png" />
    <link rel="icon" href="/backend/icon/logomember.png" />
    
    <!-- External Libs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
      
      :root {
        --jago-red: #e11d2e;
        --jago-dark: #111827;
      }
      
      body {
        font-family: 'Inter', sans-serif;
        background-color: #FDFCFB;
      }

      .jago-gradient-bg {
        background: radial-gradient(circle at top right, rgba(225, 29, 46, 0.05), transparent),
                    radial-gradient(circle at bottom left, rgba(225, 29, 46, 0.02), transparent);
      }

      .card-shadow {
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.04);
      }

      .input-field {
        transition: all 0.3s ease;
      }

      .input-field:focus {
        border-color: var(--jago-red);
        box-shadow: 0 0 0 4px rgba(225, 29, 46, 0.1);
      }

      .jago-btn-primary {
        background-color: var(--jago-red);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .jago-btn-primary:hover {
        background-color: var(--jago-dark);
        transform: translateY(-2px);
      }

      .glass-effect {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }

      @keyframes slideUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .animate-slide-up {
        animation: slideUp 0.6s ease-out forwards;
      }
    </style>
  </head>

  <body class="jago-gradient-bg min-h-screen text-slate-900">
    <!-- HIDDEN ENGINE -->
    <canvas id="hidden_canvas" width="464" height="668" class="hidden"></canvas>

    <!-- NAV -->
    <nav class="sticky top-0 z-50 glass-effect border-b border-gray-100 h-20">
      <div class="max-w-7xl mx-auto px-6 h-full flex items-center justify-between">
        <div class="flex items-center gap-4">
          <div class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center text-white font-black text-[10px] leading-none text-center italic shadow-lg shadow-red-200 uppercase">THE<br/>JAGO</div>
          <div>
            <h1 class="text-lg font-black tracking-tight text-red-600 italic uppercase leading-none">THE JAGO</h1>
            <p class="text-[9px] font-black uppercase tracking-[0.3em] text-gray-400 mt-1">Admin Control Center</p>
          </div>
        </div>

        <div class="flex items-center gap-3 bg-gray-50 px-4 py-2 rounded-2xl border border-gray-100">
          <div id="wa_dot" class="h-2 w-2 rounded-full bg-red-500 animate-pulse"></div>
          <span id="wa_label" class="text-[10px] font-black uppercase tracking-widest text-gray-500">Offline</span>
        </div>
      </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-12">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-12">
        
        <!-- LEFT: DATA INPUT -->
        <div class="lg:col-span-7 space-y-8 animate-slide-up">
          <div class="bg-white p-10 rounded-[40px] border border-gray-100 card-shadow space-y-8">
             <div>
                <h2 class="text-3xl font-black text-gray-900 uppercase italic leading-none">Member Registration</h2>
                <p class="text-xs text-gray-400 font-bold uppercase tracking-widest mt-3">Sistem Pengiriman Kartu Otomatis v5.0</p>
             </div>

             <!-- MODE SELECT -->
             <div class="flex bg-gray-50 p-1.5 rounded-2xl border border-gray-100">
               <button onclick="setMode('manual')" id="mode_manual" class="flex-1 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all bg-white text-red-600 shadow-sm">1. Input Manual</button>      
               <button onclick="setMode('bulk')" id="mode_bulk" class="flex-1 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all text-gray-400">2. Bulk Import</button>
             </div>

             <!-- MANUAL FORM -->
             <div id="section_manual" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                   <div class="space-y-2">
                      <label class="text-[10px] font-black uppercase tracking-widest text-gray-400 ml-4">Nama Pelanggan</label>
                      <input id="manual_name" class="input-field w-full h-14 bg-gray-50 border border-gray-100 rounded-2xl px-6 text-sm font-black outline-none" placeholder="Budi Santoso" oninput="updatePreview()"/>
                   </div>
                   <div class="space-y-2">
                      <label class="text-[10px] font-black uppercase tracking-widest text-gray-400 ml-4">No. WhatsApp</label>
                      <input id="manual_whatsapp" class="input-field w-full h-14 bg-gray-50 border border-gray-100 rounded-2xl px-6 text-sm font-black outline-none" placeholder="08xxxxxxxx" />
                   </div>
                </div>
                <div class="space-y-2">
                   <label class="text-[10px] font-black uppercase tracking-widest text-gray-400 ml-4">ID Member (Custom)</label>
                   <input id="manual_id" class="input-field w-full h-14 bg-gray-50 border border-gray-100 rounded-2xl px-6 text-sm font-black outline-none" placeholder="ID akan tergenerate otomatis jika kosong" oninput="updatePreview()"/>
                </div>
                <button onclick="sendManual()" id="btn_send_manual" class="jago-btn-primary w-full h-16 text-white rounded-[2rem] text-xs font-black uppercase tracking-[0.3em] shadow-xl shadow-red-100">Kirim Kartu Sekarang</button>
             </div>

             <!-- BULK SECTION -->
             <div id="section_bulk" class="hidden space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div class="relative border-2 border-dashed border-gray-200 rounded-3xl p-8 flex flex-col items-center justify-center hover:border-red-400 transition-colors cursor-pointer bg-gray-50/50" onclick="document.getElementById('file_input').click()">
                    <input type="file" id="file_input" class="hidden" accept=".csv,.xls,.xlsx" onchange="handleFile(this)" />
                    <p class="text-[10px] font-black uppercase tracking-widest text-gray-400">Pilih File CSV/Excel</p>
                  </div>
                  <div class="bg-gray-950 rounded-3xl p-6 text-white flex items-center justify-between">
                     <div>
                        <p class="text-[9px] font-black uppercase tracking-widest opacity-50">Total Rows</p>
                        <h4 id="row_count" class="text-2xl font-black italic">0 Data</h4>
                     </div>
                     <button onclick="clearData()" class="text-red-500 text-[10px] font-black uppercase">Clear</button>
                  </div>
                </div>
                
                <div class="space-y-2">
                   <label class="text-[10px] font-black uppercase tracking-widest text-gray-400 ml-4">CSV Raw Preview</label>
                   <textarea id="csv_text" class="input-field w-full min-h-[100px] bg-gray-50 border border-gray-100 rounded-2xl p-4 text-[10px] font-bold font-mono outline-none"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                   <button onclick="sendBulk(false)" id="btn_bulk_text" disabled class="h-14 bg-white border-2 border-gray-900 text-gray-950 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-gray-50 transition-all disabled:opacity-30">Kirim Teks Saja</button>
                   <button onclick="sendBulk(true)" id="btn_bulk_card" disabled class="jago-btn-primary h-14 text-white rounded-2xl text-[10px] font-black uppercase tracking-widest shadow-xl shadow-red-100 disabled:opacity-30">Kirim Gambar Kartu</button>
                </div>
             </div>
          </div>

          <!-- WA SETTINGS -->
          <div class="bg-white p-8 rounded-[40px] border border-gray-100 card-shadow space-y-6">
             <div class="flex items-center justify-between">
                <p class="text-[10px] font-black uppercase tracking-widest text-red-500">Gateway Settings</p>
                <div id="wa_badge" class="px-3 py-1 bg-red-50 text-red-600 rounded-lg text-[8px] font-black uppercase border border-red-100">DISCONNECTED</div>
             </div>
             <div class="flex flex-col md:flex-row gap-3">
                <input id="base_url" class="input-field flex-[3] h-14 bg-gray-50 border border-gray-100 rounded-2xl px-5 text-xs font-black outline-none" placeholder="Railway API URL (https://...)" />
                <button onclick="saveBase()" class="flex-1 bg-gray-950 text-white rounded-2xl text-[10px] font-black uppercase tracking-widest shadow-lg">Save URL</button>
             </div>
             
             <!-- QR AREA -->
             <div id="qr_container" class="hidden flex flex-col items-center py-6 bg-red-50/30 rounded-[2rem] border border-red-100">
                <p class="text-[10px] font-black uppercase tracking-widest text-red-600 mb-4">Scan QR to Authenticate</p>
                <img id="qr_image" class="w-48 h-48 bg-white p-3 rounded-2xl border shadow-xl" src="" alt="QR" />
             </div>
          </div>
        </div>

        <!-- RIGHT: PREVIEW AREA (STICKY) -->
        <div class="lg:col-span-5 space-y-8 sticky top-32 animate-slide-up" style="animation-delay: 0.1s">
          <div class="flex items-center justify-between">
             <h3 class="text-[10px] font-black uppercase tracking-[0.4em] text-gray-400 italic leading-none">Live Card Render</h3>
             <span class="px-2 py-1 bg-black text-white text-[8px] font-black rounded-lg uppercase tracking-widest">1:1 Scale</span>
          </div>

          <div class="relative group">
             <!-- Glow -->
             <div class="absolute -inset-1 bg-gradient-to-tr from-red-600 to-amber-400 rounded-[3rem] blur opacity-10 group-hover:opacity-25 transition duration-1000"></div>
             
             <div class="relative bg-white p-3 rounded-[48px] border border-gray-100 shadow-2xl transition-all duration-700 hover:scale-[1.02]">
                <img id="preview_img" class="w-full rounded-[38px] border border-gray-50 shadow-inner" src="/backend/member-card-template.jpg" alt="Preview" />
                
                <div class="absolute bottom-10 left-10 right-10 glass-effect p-5 rounded-3xl border border-white/50 flex items-center justify-between shadow-xl">
                   <div class="space-y-1">
                      <p class="text-[8px] font-black text-gray-400 uppercase tracking-widest">Engine Status</p>
                      <p class="text-[11px] font-black text-green-600 uppercase tracking-tighter italic">Synced & Ready</p>
                   </div>
                   <div class="h-10 w-10 rounded-2xl bg-red-50 flex items-center justify-center border border-red-100">
                      <div class="h-2 w-2 rounded-full bg-red-600 animate-ping"></div>
                   </div>
                </div>
             </div>
          </div>

          <div class="bg-white p-8 rounded-[40px] border border-gray-100 card-shadow space-y-4">
             <p class="text-[10px] font-black uppercase tracking-widest text-gray-400">Card Controls</p>
             <div class="grid grid-cols-2 gap-3">
                <button onclick="updatePreview()" class="h-12 bg-gray-50 border border-gray-100 rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-white transition-all">Refresh</button>
                <button onclick="downloadCard()" class="h-12 bg-gray-950 text-white rounded-xl text-[10px] font-black uppercase tracking-widest shadow-lg shadow-gray-200 hover:bg-red-600 transition-all">Download JPG</button>
             </div>
          </div>
        </div>

      </div>
    </main>

    <!-- TOAST -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 glass-effect px-8 py-4 rounded-3xl font-black text-[10px] uppercase tracking-[0.3em] shadow-2xl z-[100] border border-gray-100 hidden"></div>

    <script>
      const STORE_WA = '082110202044';
      let activeMode = 'manual';
      let parsedData = [];

      // --- CORE ENGINE ---
      async function generateCard(data) {
        const canvas = document.getElementById('hidden_canvas');
        const ctx = canvas.getContext('2d');
        const w = canvas.width, h = canvas.height;

        const img = new Image();
        img.src = '/backend/member-card-template.jpg';
        await new Promise(r => { img.onload = r; img.onerror = r; });

        ctx.clearRect(0,0,w,h);
        ctx.drawImage(img, 0,0,w,h);

        // Name
        ctx.textAlign = 'center';
        ctx.fillStyle = '#111827';
        ctx.font = 'bold 22px "Inter", sans-serif';
        ctx.fillText((data.name || 'NAMA PELANGGAN').toUpperCase(), w/2, 275);

        // ID Label
        ctx.fillStyle = '#6B7280';
        ctx.font = 'bold 12px "Inter", sans-serif';
        ctx.fillText('MEMBER ID', w/2, 310);

        // ID Value
        ctx.fillStyle = '#E11D2E';
        ctx.font = '900 30px "Courier New", monospace';
        ctx.fillText(data.memberId || '2026XXXXXXXX', w/2, 345);

        // Barcode
        try {
          const bCanvas = document.createElement('canvas');
          JsBarcode(bCanvas, data.memberId || '20260000', {
            format: "CODE128", width: 2, height: 60, displayValue: false, margin: 0
          });
          ctx.fillStyle = 'white';
          ctx.roundRect((w-320)/2, 480, 320, 100, 10);
          ctx.fill();
          ctx.drawImage(bCanvas, (w-300)/2, 490, 300, 80);
        } catch(e) {}

        return canvas.toDataURL('image/jpeg', 0.95);
      }

      async function updatePreview() {
        const data = {
          name: document.getElementById('manual_name').value,
          memberId: document.getElementById('manual_id').value || '2026'+Math.floor(Math.random()*1000000)
        };
        const url = await generateCard(data);
        document.getElementById('preview_img').src = url;
      }

      function setMode(m) {
        activeMode = m;
        document.getElementById('section_manual').classList.toggle('hidden', m !== 'manual');
        document.getElementById('section_bulk').classList.toggle('hidden', m !== 'bulk');
        
        const btnM = document.getElementById('mode_manual'), btnB = document.getElementById('mode_bulk');
        btnM.className = m === 'manual' ? 'flex-1 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all bg-white text-red-600 shadow-sm' : 'flex-1 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all text-gray-400';
        btnB.className = m === 'bulk' ? 'flex-1 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all bg-white text-red-600 shadow-sm' : 'flex-1 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all text-gray-400';
      }

      // --- APP LOGIC ---
      function toast(m, isError = false) {
        const el = document.getElementById('toast');
        el.textContent = m;
        el.classList.remove('hidden');
        el.className = `fixed bottom-10 left-1/2 -translate-x-1/2 glass-effect px-8 py-4 rounded-3xl font-black text-[10px] uppercase tracking-[0.3em] shadow-2xl z-[100] border border-gray-100 ${isError ? 'text-red-600' : 'text-green-600'}`;
        setTimeout(() => el.classList.add('hidden'), 5000);
      }

      function saveBase() {
        const url = document.getElementById('base_url').value;
        localStorage.setItem('jago_base', url);
        toast('URL API Disimpan');
        checkStatus();
      }

      async function checkStatus() {
        const base = localStorage.getItem('jago_base') || '';
        if(!base) return;
        try {
          const res = await fetch(base + '/status');
          const json = await res.json();
          document.getElementById('wa_label').innerText = json.status;
          document.getElementById('wa_dot').className = `h-2 w-2 rounded-full ${json.status === 'online' ? 'bg-green-500' : 'bg-red-500'} animate-pulse`;
          document.getElementById('wa_badge').innerText = json.status.toUpperCase();
          document.getElementById('wa_badge').className = `px-3 py-1 rounded-lg text-[8px] font-black uppercase border ${json.status === 'online' ? 'bg-green-50 text-green-600 border-green-100' : 'bg-red-50 text-red-600 border-red-100'}`;
          
          if(json.status === 'qr' && json.qr) {
            document.getElementById('qr_container').classList.remove('hidden');
            document.getElementById('qr_image').src = json.qr;
          } else {
            document.getElementById('qr_container').classList.add('hidden');
          }
        } catch(e) {}
      }

      async function handleFile(input) {
        const file = input.files[0];
        if(!file) return;
        
        let text = '';
        if (file.name.endsWith('.xls') || file.name.endsWith('.xlsx')) {
          const wb = XLSX.read(await file.arrayBuffer());
          text = XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]]);
        } else {
          text = await file.text();
        }
        
        document.getElementById('csv_text').value = text;
        parseAndRender(text);
      }

      function parseAndRender(text) {
        const lines = text.split('\n').filter(l => l.trim());
        const rows = lines.slice(1).map(l => {
          const c = l.split(',');
          return { memberId: c[0]?.trim(), name: c[1]?.trim(), whatsapp: c[2]?.trim() };
        }).filter(r => r.memberId && r.name);

        parsedData = rows;
        document.getElementById('row_count').innerText = `${rows.length} Data`;
        document.getElementById('btn_bulk_text').disabled = rows.length === 0;
        document.getElementById('btn_bulk_card').disabled = rows.length === 0;
        toast(`${rows.length} data berhasil diproses`);
      }

      async function sendManual() {
        const base = localStorage.getItem('jago_base');
        if(!base) return toast('Simpan URL API dulu!', true);

        const data = {
          name: document.getElementById('manual_name').value,
          memberId: document.getElementById('manual_id').value || '2026'+Date.now(),
          whatsapp: document.getElementById('manual_whatsapp').value
        };

        if(!data.name || !data.whatsapp) return toast('Lengkapi Nama & WA', true);

        const image = await generateCard(data);
        const phone = data.whatsapp.startsWith('0') ? '62' + data.whatsapp.slice(1) : data.whatsapp;

        try {
          const res = await fetch(base + '/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              phone,
              message: `Halo *${data.name}*,\nIni adalah Kartu Member Digital THE JAGO Anda.\n\nNomor Member: *${data.memberId}*`,
              image
            })
          });
          if(res.ok) toast('Kartu Terkirim!');
          else toast('Gagal Kirim', true);
        } catch(e) { toast(e.message, true); }
      }

      function downloadCard() {
        const link = document.createElement('a');
        link.download = 'member-card.jpg';
        link.href = document.getElementById('preview_img').src;
        link.click();
      }

      // Init
      document.getElementById('base_url').value = localStorage.getItem('jago_base') || '';
      setInterval(checkStatus, 10000);
      checkStatus();
      updatePreview();
    </script>
  </body>
</html>
