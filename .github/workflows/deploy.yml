name: Deploy to FTP

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install root dependencies
      run: npm ci
      working-directory: ./todo-app/website

    - name: Build frontend
      run: |
        cd todo-app/frontend
        npm ci
        npm run build

    - name: Prepare environment for upload
      run: |
        # copy .env from secrets or generate dynamically
        cat <<'EOF' > todo-app/website/.env
        PORT=3000
        STATIC_DIR= ../frontend/dist
        FTP_HOST=${{ secrets.FTP_HOST }}
        FTP_PORT=${{ secrets.FTP_PORT }}
        FTP_TYPE=${{ secrets.FTP_TYPE }}
        FTP_USER=${{ secrets.FTP_USER }}
        FTP_PASS=${{ secrets.FTP_PASS }}
        # add any other needed vars, but avoid committing secrets
        EOF

    - name: Upload via script
      run: node scripts/ftp-upload.js
      working-directory: ./todo-app/website
      env:
        FTP_HOST: ${{ secrets.FTP_HOST }}
        FTP_PORT: ${{ secrets.FTP_PORT }}
        FTP_TYPE: ${{ secrets.FTP_TYPE }}
        FTP_USER: ${{ secrets.FTP_USER }}
        FTP_PASS: ${{ secrets.FTP_PASS }}

    - name: Clean up sensitive files
      run: rm -f todo-app/website/.env
